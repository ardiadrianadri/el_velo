name: CI
on:
  push:
    paths-ignore:
      - .github/workflows/ci.yml
  pull_request:
    branches:
      - main
    paths-ignore:
      - .github/workflows/ci.yml
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Lint
        run: npm run lint
      - name: Unit Test
        run: npm test
      - name: E2E Test
        run: npm run test:e2e