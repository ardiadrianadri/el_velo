name: CI
on:
  push:
    paths-ignore:
      - .github/workflows/ci.yml
  pull_request:
    branches:
      - main
      - develop
    paths-ignore:
      - .github/workflows/ci.yml
  pull_request_target:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  build:
    if: github.event_name != 'pull_request_target'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 26
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Lint
        run: npm run lint
      - name: Unit Test
        run: npm run test:coverage
      - name: E2E Test
        run: npm run test:e2e
      - name: Vulnerability scan in dependencies
        run: npm audit --audit-level=high --omit=dev
  typescript-review:
    if: github.event_name == 'pull_request_target' && github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.event.pull_request.base.ref == 'main' && 'production' || 'development'}}
      deployment: false

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.base.sha }}
        name: Checkout
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 26
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Fetch pull request head commit
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git fetch --no-tags origin "refs/pull/${PR_NUMBER}/head:refs/remotes/pull/${PR_NUMBER}/head"
          FETCHED_HEAD="$(git rev-parse "refs/remotes/pull/${PR_NUMBER}/head")"
          if [ "$FETCHED_HEAD" != "$PR_HEAD_SHA" ]; then
            echo "The pull request head changed while the review job was starting; rerun the workflow." >&2
            exit 1
          fi
      - name: Load trusted TypeScript review profile
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git show "${PR_BASE_SHA}:.github/ai-review/profiles/typescript-review.md" > "$RUNNER_TEMP/typescript-review.md"
          echo "TYPESCRIPT_REVIEW_PROFILE_PATH=$RUNNER_TEMP/typescript-review.md" >> "$GITHUB_ENV"
      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.CLIENT_ID}}
          private-key: ${{ secrets.PRIVATE_KEY }}
          permission-pull-requests: write
      - name: Analyze and publish TypeScript review
        working-directory: packages/tools/typescript-review
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BRANCH_TO_COMPARE: ${{ github.event.pull_request.base.ref }}
          REVIEW_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          REVIEW_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REQUIRE_TRUSTED_REVIEW_PROFILE: 'true'
        run: npm run start
