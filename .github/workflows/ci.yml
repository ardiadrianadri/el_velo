name: CI
on:
  push:
    paths-ignore:
      - .github/workflows/ci.yml
  pull_request:
    branches:
      - main
      - develop
    paths-ignore:
      - .github/workflows/ci.yml

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 26
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Lint
        run: npm run lint
      - name: Unit Test
        run: npm run test:coverage
      - name: E2E Test
        run: npm run test:e2e
      - name: Vulnerability scan in dependencies
        run: npm audit --audit-level=high --omit=dev
  typescript-review:
    needs: build
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.event.pull_request.base.ref == 'main' && 'production' || 'development'}}
      deployment: false

    steps:
      - uses: actions/checkout@v6
        with:
          # Review the PR head, not GitHub's synthetic merge commit. Inline
          # review comments must point to this commit's diff.
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
        name: Checkout
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 26
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Fetch pull request base branch
        run: git fetch origin ${{ github.event.pull_request.base.ref }} --depth=1
      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.CLIENT_ID}}
          private-key: ${{ secrets.PRIVATE_KEY }}
          permission-pull-requests: write
      - name: Analyze and publish TypeScript review
        working-directory: packages/tools/typescript-review
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BRANCH_TO_COMPARE: ${{ github.event.pull_request.base.ref }}
          TYPESCRIPT_REVIEW_PROFILE_PATH: ${{ vars.TYPESCRIPT_REVIEW_PROFILE_PATH }}
          TYPESCRIPT_REVIEW_PROFILE_KEY: ${{ secrets.TYPESCRIPT_REVIEW_PROFILE_KEY }}
        run: npm run start
